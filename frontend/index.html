<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9E0A57" />
    <meta name="description" content="Kormopulse connects skilled people with growing teams." />
    <title>Kormopulse | Careers that move</title>
    <script>
      // Set the theme before React mounts so the page never flashes the wrong colors.
      (function () {
        try {
          var stored = localStorage.getItem("kormopulse-theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          // localStorage unavailable: default to light, useTheme() will correct it on mount
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
